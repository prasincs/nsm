run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errcheck
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unused
    - gocyclo
    - goconst
    - unparam

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  gosec:
    excludes:
      - G304 # File path provided by user input - acceptable for NSM device access

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
    - path: example/
      linters:
        - gosec